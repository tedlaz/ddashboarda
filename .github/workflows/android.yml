# Builds the Android APK on GitHub's servers (Android SDK + NDK are preinstalled there).
# Download it from the run page: Actions -> latest run -> Artifacts -> ddashboarda-apk.
name: android

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - run: rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - run: cargo install cargo-apk --locked

      # Same signing key every build (repo secret), so a new APK installs over the old one.
      - run: echo "$KS" | base64 -d > ~/release.keystore
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}

      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" > /dev/null

      # The runner only exports ANDROID_NDK_LATEST_HOME; cargo-apk wants ANDROID_NDK_ROOT.
      - run: ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME" cargo apk build --lib --release
        env:
          CARGO_APK_RELEASE_KEYSTORE: /home/runner/release.keystore
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: ddashboarda-apk
          path: target/release/apk/ddashboarda.apk

      # Push a tag to publish the APK as a GitHub release (IzzyOnDroid picks it up from there).
      # Bump `version` in Cargo.toml first: it sets the versionCode, which must go up every release.
      - if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" target/release/apk/ddashboarda.apk --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
